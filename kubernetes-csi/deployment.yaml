apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-s3-writer
  namespace: default
  labels:
    app: csi-s3-writer
spec:
  replicas: 5
  selector:
    matchLabels:
      app: csi-s3-writer
  template:
    metadata:
      labels:
        app: csi-s3-writer
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /mnt/s3-data
          while true; do
            echo "$(date -Iseconds) $(hostname) is running" >> /mnt/s3-data/writer-$(hostname).log
            echo "$(date -Iseconds)" > /mnt/s3-data/last-write-$(hostname).txt
            sync
            sleep 10
          done
        volumeMounts:
        - name: s3-volume
          mountPath: /mnt/s3-data
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      
      volumes:
      - name: s3-volume
        persistentVolumeClaim:
          claimName: csi-s3-pvc
