{{- if .Values.rbac.metricsReader.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "homework-app.metricsClusterRoleBindingName" . }}
  labels:
    {{- include "homework-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "homework-app.metricsServiceAccountName" . }}
    namespace: {{ include "homework-app.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "homework-app.metricsClusterRoleName" . }}
{{- end }}
