apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homework-app.fullname" . }}
  namespace: {{ include "homework-app.namespace" . }}
  labels:
    {{- include "homework-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "homework-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homework-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homework-app.podServiceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainer.enabled }}
      initContainers:
        - name: {{ .Values.initContainer.name }}
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          command:
            - sh
          args:
            - {{ printf "%s/%s" (.Values.initContainer.scriptConfigMap.mountPath | trimSuffix "/") .Values.initContainer.scriptConfigMap.fileName | quote }}
          {{- if .Values.initContainer.resources }}
          resources:
            {{- toYaml .Values.initContainer.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.initContainer.scriptConfigMap.mountName }}
              mountPath: {{ .Values.initContainer.scriptConfigMap.mountPath }}
          {{- if .Values.persistence.enabled }}
            - name: {{ .Values.persistence.volumeName }}
              mountPath: {{ .Values.persistence.initMountPath }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.container.name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - nginx
            - -g
            - daemon off;
          ports:
            - name: {{ .Values.container.portName }}
              containerPort: {{ .Values.container.port }}
              protocol: {{ .Values.container.protocol }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- $startupProbe := omit .Values.probes.startup "enabled" -}}
            {{- $_ := set $startupProbe.httpGet "port" .Values.container.port -}}
            {{- $startupProbe | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- $readinessProbe := omit .Values.probes.readiness "enabled" -}}
            {{- $_ := set $readinessProbe.httpGet "port" .Values.container.port -}}
            {{- $readinessProbe | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- $livenessProbe := omit .Values.probes.liveness "enabled" -}}
            {{- $_ := set $livenessProbe.httpGet "port" .Values.container.port -}}
            {{- $livenessProbe | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.configMap.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: {{ .Values.persistence.volumeName }}
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.configMap.enabled }}
            - name: {{ .Values.configMap.mountName }}
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: {{ .Values.configMap.fileName }}
            - name: {{ .Values.configMap.mountName }}
              mountPath: {{ include "homework-app.confDir" . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.lifecycle.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - rm
                  - -f
                  - {{ include "homework-app.indexFile" . | quote }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.configMap.enabled .Values.initContainer.enabled }}
      volumes:
        {{- if .Values.initContainer.enabled }}
        - name: {{ .Values.initContainer.scriptConfigMap.mountName }}
          configMap:
            name: {{ include "homework-app.initScriptConfigMapName" . }}
            defaultMode: 0755
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: {{ .Values.persistence.volumeName }}
          persistentVolumeClaim:
            claimName: {{ include "homework-app.pvcName" . }}
        {{- end }}
        {{- if .Values.configMap.enabled }}
        - name: {{ .Values.configMap.mountName }}
          configMap:
            name: {{ include "homework-app.configMapName" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
