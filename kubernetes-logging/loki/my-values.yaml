global:
  dnsService: coredns

deploymentMode: Monolithic

defaults:
  nodeSelector: &infraNodeSelector
    node-role: infra
  tolerations: &infraTolerations
    - key: node-role
      operator: Equal
      value: infra
      effect: NoSchedule

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks-otus
      ruler: loki-ruler-otus
    s3:
      endpoint: https://s3.cloud.ru
      region: ru-central-1
      accessKeyId: "${S3_ACCESS_KEY_ID}"
      secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
      s3ForcePathStyle: true
      insecure: false

  schemaConfig:
    configs:
      - from: 2026-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
  nodeSelector: *infraNodeSelector
  tolerations: *infraTolerations
  persistence:
    enabled: false

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  nodeSelector: *infraNodeSelector
  tolerations: *infraTolerations

lokiCanary:
  nodeSelector: *infraNodeSelector
  tolerations: *infraTolerations

resultsCache:
  nodeSelector: *infraNodeSelector
  tolerations: *infraTolerations

chunksCache:
  allocatedMemory: 2048
  allocatedCPU: 250m
  connectionLimit: 4096
  writebackSizeLimit: 128MB
  writebackBuffer: 100000
  nodeSelector: *infraNodeSelector
  tolerations: *infraTolerations
  l2:
    nodeSelector: *infraNodeSelector
    tolerations: *infraTolerations

minio:
  enabled: false
