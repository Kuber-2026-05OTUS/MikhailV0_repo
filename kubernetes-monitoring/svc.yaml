---
apiVersion: v1
kind: Service
metadata:
  name: nginx-stub-status
  namespace: nginx-monitoring
  labels:
    app: nginx-stub-status
spec:
  type: ClusterIP
  selector:
    app: nginx-stub-status
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: 9113