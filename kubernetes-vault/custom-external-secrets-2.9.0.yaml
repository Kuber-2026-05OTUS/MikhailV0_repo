image:
  repository: harbor.mvl.test/ghcr/external-secrets/external-secrets
  tag: "v2.9.0"
  pullPolicy: IfNotPresent

installCRDs: true

processClusterExternalSecret: false
processClusterStore: false
processClusterGenerator: false
processClusterPushSecret: false
processPushSecret: false

crds:
  createSecretStore: true
  createClusterSecretStore: false
  createClusterExternalSecret: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false
  conversion:
    enabled: false

replicaCount: 1
leaderElect: false

serviceAccount:
  create: true
  name: external-secrets
  automount: true

rbac:
  create: true
  serviceAccountTokenCreate: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  create: true
  replicaCount: 1
  image:
    repository: harbor.mvl.test/ghcr/external-secrets/external-secrets
    tag: "v2.9.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: external-secrets-webhook
    automount: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  create: true
  replicaCount: 1
  image:
    repository: harbor.mvl.test/ghcr/external-secrets/external-secrets
    tag: "v2.9.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: external-secrets-cert-controller
    automount: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

serviceMonitor:
  enabled: false

metrics:
  service:
    enabled: false

bitwarden-sdk-server:
  enabled: false
